[project]
name = "mcp-github-server"
dynamic = ["version"]
description = "Modular MCP HTTP server for GitHub API with auto-discovered tools"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-server = "mcp_server.server:main"

[tool.setuptools.dynamic]
version = {attr = "mcp_server.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
