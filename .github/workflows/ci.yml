name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke import
        run: python -c "import mcp_server, mcp_server.server; print('import ok')"
      - name: Show version
        run: python -c "import mcp_server; print(mcp_server.__version__)"
      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/*
